name: build-xgboost-rf

# Compila XGBoost 3.2.0 con la modifica [RF_GROUPS] (gruppi di feature per
# livello), solo CPU, su Windows. Produce un .whl da scaricare in "Artifacts".
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: File di questo repository (patch e test)
        uses: actions/checkout@v4
        with:
          path: rf

      - name: Sorgenti ufficiali XGBoost 3.2.0
        uses: actions/checkout@v4
        with:
          repository: dmlc/xgboost
          ref: v3.2.0
          submodules: recursive
          path: xgboost

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Applica la modifica
        run: python rf/rf_patch.py xgboost

      - name: Compila il pacchetto (solo CPU)
        working-directory: xgboost
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip wheel -v ./python-package -w ../dist --no-deps

      - name: Installa e verifica la modifica
        run: |
          python -m pip install numpy pandas scipy
          $whl = Get-ChildItem dist\*.whl | Select-Object -First 1
          python -m pip install $whl.FullName
          python rf/rf_selftest.py

      - name: Pubblica il pacchetto
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-3.2.0-rfgroups-cpu-win
          path: dist/*.whl
