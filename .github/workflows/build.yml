name: build-xgboost-rf

# Compila XGBoost 3.2.0 con la modifica [RF_GROUPS] (gruppi di feature per
# livello), solo CPU, su Windows. Produce un .whl da scaricare in "Artifacts".
#
# Nota (run 1): il packager di XGBoost cerca solo i generatori Visual Studio
# 2017/2019/2022; sull'immagine attuale di GitHub non li trova e ripiega su
# MinGW (GCC), producendo una xgboost.dll che dipende dalle DLL di MinGW
# (libgomp, libstdc++...) e che quindi non si carica. Qui la libreria si
# compila PRIMA con CMake e il compilatore Microsoft (generatore scelto da
# CMake, il Visual Studio installato); il packager trova poi xgboost.dll gia'
# pronta in xgboost/lib e la usa senza ricompilare.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: File di questo repository (patch e test)
        uses: actions/checkout@v4
        with:
          path: rf

      - name: Sorgenti ufficiali XGBoost 3.2.0
        uses: actions/checkout@v4
        with:
          repository: dmlc/xgboost
          ref: v3.2.0
          submodules: recursive
          path: xgboost

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Applica la modifica
        run: python rf/rf_patch.py xgboost

      - name: Compila xgboost.dll con MSVC (solo CPU)
        run: |
          cmake --version
          cmake -S xgboost -B build -A x64 -DUSE_OPENMP=ON -DHIDE_CXX_SYMBOLS=ON -DUSE_CUDA=OFF
          cmake --build build --config Release --parallel 4
          $dll = Get-ChildItem -Path xgboost\lib, build -Recurse -Filter xgboost.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "xgboost.dll non trovata dopo la compilazione" }
          New-Item -ItemType Directory -Force -Path xgboost\lib | Out-Null
          if ($dll.FullName -ne (Resolve-Path xgboost\lib).Path + "\xgboost.dll") { Copy-Item $dll.FullName xgboost\lib\xgboost.dll -Force }
          Get-ChildItem xgboost\lib

      - name: Pacchetto Python (usa la libreria gia' compilata)
        working-directory: xgboost
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip wheel -v ./python-package -w ../dist --no-deps

      - name: Installa e verifica la modifica
        run: |
          python -m pip install numpy pandas scipy
          $whl = Get-ChildItem dist\*.whl | Select-Object -First 1
          python -m pip install $whl.FullName
          python rf/rf_selftest.py

      - name: Pubblica il pacchetto
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-3.2.0-rfgroups-cpu-win
          path: dist/*.whl
