name: build-xgboost-rf-cuda

# [RF_CUDA] Variante CUDA di build.yml: stesso sorgente XGBoost 3.2.0 con la
# modifica [RF_GROUPS] (rf_patch.py), compilato CON la GPU, su Windows.
# Produce xgboost_rf-...whl in "Artifacts" (nome: xgboost_rf-3.2.0-rfgroups-
# cuda-win). La build solo CPU (build.yml) resta intatta e separata.
#
# Perche' basta compilare: la patch tocca solo ColumnSampler
# (src/common/random.h), il componente che sceglie le feature ammesse a ogni
# livello. Lo usano sia l'albero CPU (hist) sia quello GPU (cuda), e
# l'elenco filtrato viene gia' assegnato al device del contesto
# (out->SetDevice(ctx_->Device())). Nessun codice CUDA da scrivere.
#
# Scelte:
# - CUDA 12.8.1: la prima serie con l'architettura Blackwell consumer
#   (sm_120, RTX 50xx). Richiede un driver NVIDIA >= 570 sul PC.
# - CMAKE_CUDA_ARCHITECTURES=120: solo la scheda di destinazione (5070 Ti).
#   "120" in CMake = codice macchina sm_120 + PTX compute_120. Compilare una
#   sola architettura accorcia molto la build.
# - Generatore Ninja con l'ambiente MSVC (vcvars64): evita l'integrazione
#   CUDA di Visual Studio/MSBuild, fonte tipica di errori sui runner.
# - [RF_CUDA_VS2022] Compilatore Microsoft di Visual Studio 2022 (toolset
#   14.4x), quello che CUDA 12.8 supporta ufficialmente. Per questo il runner
#   e' windows-2022 e vswhere cerca solo VS 2022 (versione [17.0,18.0)).
#   Prima prova (6/10/2026) su windows-2025: l'immagine ha Visual Studio
#   2026 (MSVC 19.51, toolset 14.51). nvcc lo rifiuta ("only the versions
#   between 2017 and 2022") e con -allow-unsupported-compiler cudafe++ va in
#   crash (ACCESS_VIOLATION) gia' nel rilevamento del compilatore di CMake.
#   Il flag -allow-unsupported-compiler e' stato TOLTO: con VS 2022 non
#   serve, e se un giorno il compilatore non fosse piu' supportato nvcc lo
#   dice chiaramente invece di andare in crash a meta'.
# - Toolkit installato COMPLETO (metodo "local"): piu' lento ma senza
#   rischio di sottopacchetti mancanti (cudart, CCCL/thrust, nvtx...).
# - Il runner non ha GPU: il selftest qui verifica la build CUDA
#   (--expect-cuda) e le prove A-E sulla CPU, che usano lo stesso sorgente
#   patchato. Le prove SULLA GPU (G1-G3) vanno fatte sul PC con:
#       python rf_selftest.py --gpu --expect-cuda
#
# Parte a mano (Actions -> build-xgboost-rf-cuda -> Run workflow) e a ogni
# push che tocca questo file, la patch o il selftest.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-cuda.yml'
      - 'rf_patch.py'
      - 'rf_selftest.py'
      - 'rf_rename_wheel.py'

jobs:
  build:
    # [RF_CUDA_VS2022] windows-2022 = Visual Studio 2022, supportato da
    # CUDA 12.8 (windows-2025 ha VS 2026: non supportato, vedi sopra)
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - name: File di questo repository (patch e test)
        uses: actions/checkout@v5
        with:
          path: rf

      - name: Sorgenti ufficiali XGBoost 3.2.0
        uses: actions/checkout@v5
        with:
          repository: dmlc/xgboost
          ref: v3.2.0
          submodules: recursive
          path: xgboost

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: CUDA Toolkit 12.8.1
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: '12.8.1'
          method: 'local'

      - name: Verifica toolkit
        run: |
          nvcc --version
          echo "CUDA_PATH=$env:CUDA_PATH"

      - name: Ninja
        run: |
          python -m pip install --upgrade pip ninja
          ninja --version

      - name: Applica la modifica
        run: python rf/rf_patch.py xgboost

      - name: Trova Visual Studio 2022
        run: |
          # [RF_CUDA_VS2022] solo Visual Studio 2022 (versioni 17.x): e' il
          # compilatore supportato da CUDA 12.8. Se manca, stop subito.
          # La ricerca sta in PowerShell e non nel "for /f" di cmd: con piu'
          # coppie di virgolette nel comando (percorso di vswhere + "-version
          # [17.0,18.0)") cmd toglie la prima e l'ultima e spezza il percorso
          # ("'C:\Program' is not recognized", prova del 6/10/2026).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -version "[17.0,18.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            & $vswhere -products * -format text | Select-String "installationPath|installationVersion"
            throw "ERRORE [RF_CUDA_VS2022] Visual Studio 2022 non trovato sul runner: CUDA 12.8 non supporta versioni piu' recenti"
          }
          $vs = ($vs | Select-Object -First 1).Trim()
          "Visual Studio 2022: $vs"
          "VSPATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compila xgboost.dll con MSVC + CUDA (sm_120)
        shell: cmd
        run: |
          rem [RF_CUDA_VS2022] VSPATH arriva dal passo "Trova Visual Studio 2022"
          echo Visual Studio: %VSPATH%
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cmake --version
          cmake -S xgboost -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DUSE_OPENMP=ON ^
            -DHIDE_CXX_SYMBOLS=ON ^
            -DUSE_CUDA=ON ^
            -DUSE_NCCL=OFF ^
            -DPLUGIN_RMM=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES=120
          if errorlevel 1 exit /b 1
          cmake --build build --parallel 4
          if errorlevel 1 exit /b 1

      - name: Copia xgboost.dll dove la cerca il packager
        run: |
          $dll = Get-ChildItem -Path xgboost\lib, build -Recurse -Filter xgboost.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "xgboost.dll non trovata dopo la compilazione" }
          New-Item -ItemType Directory -Force -Path xgboost\lib | Out-Null
          if ($dll.FullName -ne (Resolve-Path xgboost\lib).Path + "\xgboost.dll") { Copy-Item $dll.FullName xgboost\lib\xgboost.dll -Force }
          Get-ChildItem xgboost\lib
          # [RF_CUDA] la dll non deve dipendere dalle DLL del toolkit CUDA
          # (sul PC il toolkit non c'e', solo il driver): cudart va linkato
          # statico. Elenco delle dipendenze per diagnosi.
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if ($dumpbin) {
            $deps = & $dumpbin.FullName /dependents xgboost\lib\xgboost.dll
            $deps
            if ($deps -match 'cudart64_') { throw "xgboost.dll dipende da cudart64_*.dll: sul PC senza toolkit non si caricherebbe" }
          }

      - name: Pacchetto Python (usa la libreria gia' compilata)
        working-directory: xgboost
        run: |
          python -m pip install wheel
          python -m pip wheel -v ./python-package -w ../dist --no-deps

      - name: Rinomina in xgboost_rf (installabile accanto allo standard)
        run: |
          python rf/rf_rename_wheel.py dist dist_rf
          Get-ChildItem dist_rf

      - name: Installa e verifica (build CUDA, prove sulla CPU del runner)
        run: |
          python -m pip install numpy pandas scipy scikit-learn "xgboost==3.2.0"
          $whl = Get-ChildItem dist_rf\*.whl | Select-Object -First 1
          python -m pip install --no-deps $whl.FullName
          python -m pip list | Select-String xgboost
          python rf/rf_selftest.py --expect-cuda

      - name: Pubblica il pacchetto
        uses: actions/upload-artifact@v6
        with:
          name: xgboost_rf-3.2.0-rfgroups-cuda-win
          path: dist_rf/*.whl
